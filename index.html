<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Nerd IPTV ⚡</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0a0c1b 0%, #120a2a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
    }

    .hero {
      text-align: center;
      margin: 30px 0;
    }

    .hero h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #ffffff, #6100ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .hero p {
      color: #a0a5c0;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* Botão Ver os Canais */
    .btn-main {
      background: #0044ff;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-main:hover {
      background: #0055ff;
    }

    /* Player Container */
    .player-section {
      width: 100%;
      max-width: 800px;
      margin: 20px 0 30px 0;
      display: none; /* Só abre ao selecionar um canal */
    }

    video {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      background-color: #000;
    }

    .section-title {
      width: 100%;
      max-width: 1000px;
      font-size: 1.2rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #00ff66;
      border-radius: 50%;
      display: inline-block;
    }

    .grid-channels {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #0055ff;
    }

    .card-status {
      font-size: 0.75rem;
      color: #00ff66;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 10px;
    }

    .card-icon {
      width: 50px;
      height: 50px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 1rem;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .btn-watch {
      background: linear-gradient(90deg, #0044ff, #0022aa);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    footer {
      margin-top: 50px;
      padding: 20px 0;
      text-align: center;
      color: #8a8fb0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ Nerd IPTV ⚡</div>
  </header>

  <div class="hero">
    <h1>TV AO VIVO</h1>
    <p>Assista aos seus canais favoritos em direto</p>
    <button class="btn-main" id="btnVerCanais">📺 VER OS CANAIS</button>
  </div>

  <div class="player-section" id="playerContainer">
    <video id="videoPlayer" controls autoplay></video>
  </div>

  <div class="section-title" id="canaisSection">
    <span class="live-dot"></span> AO VIVO AGORA
  </div>

  <div class="grid-channels" id="channelsGrid">
    <!-- Os canais vão ser injetados aqui -->
  </div>

  <footer>
    <p>⚡ <strong>Nerd IPTV</strong> ⚡</p>
    <p>Dono: Tojael Daniel Dev</p>
    <p>WhatsApp: +244 997 156 308</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
